aid: arrivetech
name: Arrive AI
description: 'Arrive AI (Nasdaq: ARAI) is an autonomous last-mile delivery company
  headquartered in Fishers, Indiana, founded by Dan O''Toole and originally operating
  as DroneDek. Its patented Autonomous Last Mile (ALM) platform is anchored by the
  Arrive Point, an AI-powered smart mailbox that accepts and dispatches parcels to
  and from drones, ground robots and human couriers, with temperature-controlled
  compartments, real-time tracking, smart logistics alerts and chain-of-custody
  controls aimed at healthcare, pharmacy and e-commerce logistics. The company
  markets hardware plus a network service; as of this profile it publishes no public
  developer program, API reference or machine-readable specification.'
